AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub-driven AWS-native deployment pipeline for the transaction workflow

Parameters:
  EnvironmentName:
    Type: String
    Default: demo
  ConnectionArn:
    Type: String
    Description: Existing AWS CodeConnections ARN authorized for the GitHub repository
  FullRepositoryId:
    Type: String
    Description: GitHub repository in owner/name form
  BranchName:
    Type: String
    Default: main
  ContainerImageUri:
    Type: String
    Description: Existing transaction processor image URI
  ApplicationStackName:
    Type: String
    Default: transaction-application
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.20.1.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.20.2.0/24
  Ec2InstanceType:
    Type: String
    Default: t3.micro
  TaskCpu:
    Type: String
    Default: "256"
  TaskMemory:
    Type: String
    Default: "512"
  EbsVolumeSize:
    Type: Number
    Default: 10
  LogRetentionInDays:
    Type: Number
    Default: 14

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineOperations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:UpdateStack
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt InfrastructureDeploymentRole.Arn

  InfrastructureDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TransactionInfrastructureProvisioning
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:*
                  - ecs:*
                  - events:*
                  - iam:*
                  - logs:*
                  - s3:*
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - states:*
                  - xray:*
                Resource:
                  - "*"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*"

  DeploymentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${EnvironmentName}-transaction-pipeline"
      RoleArn: !GetAtt PipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      RestartExecutionOnUpdate: true
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                DetectChanges: true
              OutputArtifacts:
                - Name: Source
        - Name: Network
          Actions:
            - Name: DeployNetwork
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub "${ApplicationStackName}-Network"
                TemplatePath: Source::infrastructure/application/networking.yaml
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                ParameterOverrides: !Sub
                  - >-
                    {"EnvironmentName":"${EnvironmentName}","VpcCidr":"${VpcCidr}","PublicSubnetACidr":"${PublicSubnetACidr}","PublicSubnetBCidr":"${PublicSubnetBCidr}"}
                  - EnvironmentName: !Ref EnvironmentName
                    VpcCidr: !Ref VpcCidr
                    PublicSubnetACidr: !Ref PublicSubnetACidr
                    PublicSubnetBCidr: !Ref PublicSubnetBCidr
              InputArtifacts:
                - Name: Source
        - Name: Storage
          Actions:
            - Name: DeployStorage
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub "${ApplicationStackName}-Storage"
                TemplatePath: Source::infrastructure/application/s3.yaml
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                ParameterOverrides: !Sub '{"EnvironmentName":"${EnvironmentName}"}'
              InputArtifacts:
                - Name: Source
        - Name: SecurityGroups
          Actions:
            - Name: DeploySecurityGroups
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub "${ApplicationStackName}-SecurityGroups"
                TemplatePath: Source::infrastructure/application/security-groups.yaml
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                ParameterOverrides: !Sub '{"EnvironmentName":"${EnvironmentName}"}'
              InputArtifacts:
                - Name: Source
        - Name: IAM
          Actions:
            - Name: DeployIAM
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub "${ApplicationStackName}-IAM"
                TemplatePath: Source::infrastructure/application/iam.yaml
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                ParameterOverrides: !Sub '{"EnvironmentName":"${EnvironmentName}"}'
              InputArtifacts:
                - Name: Source
        - Name: EC2
          Actions:
            - Name: DeployEC2
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub "${ApplicationStackName}-EC2"
                TemplatePath: Source::infrastructure/application/ec2.yaml
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}","InstanceType":"${Ec2InstanceType}","EbsVolumeSize":"${EbsVolumeSize}"}'
                  - EnvironmentName: !Ref EnvironmentName
                    Ec2InstanceType: !Ref Ec2InstanceType
                    EbsVolumeSize: !Ref EbsVolumeSize
              InputArtifacts:
                - Name: Source
        - Name: ECSCluster
          Actions:
            - Name: DeployECSCluster
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub "${ApplicationStackName}-ECSCluster"
                TemplatePath: Source::infrastructure/application/ecs-cluster.yaml
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                ParameterOverrides: !Sub '{"EnvironmentName":"${EnvironmentName}"}'
              InputArtifacts:
                - Name: Source
        - Name: ECSTask
          Actions:
            - Name: DeployECSTask
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub "${ApplicationStackName}-ECSTask"
                TemplatePath: Source::infrastructure/application/ecs-task-definition.yaml
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}","ContainerImageUri":"${ContainerImageUri}","TaskCpu":"${TaskCpu}","TaskMemory":"${TaskMemory}","LogRetentionInDays":"${LogRetentionInDays}"}'
                  - EnvironmentName: !Ref EnvironmentName
                    ContainerImageUri: !Ref ContainerImageUri
                    TaskCpu: !Ref TaskCpu
                    TaskMemory: !Ref TaskMemory
                    LogRetentionInDays: !Ref LogRetentionInDays
              InputArtifacts:
                - Name: Source
        - Name: StepFunctions
          Actions:
            - Name: DeployStepFunctions
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub "${ApplicationStackName}-StepFunctions"
                TemplatePath: Source::infrastructure/application/step-functions.yaml
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}","LogRetentionInDays":"${LogRetentionInDays}"}'
                  - EnvironmentName: !Ref EnvironmentName
                    LogRetentionInDays: !Ref LogRetentionInDays
              InputArtifacts:
                - Name: Source

Outputs:
  PipelineName:
    Value: !Ref DeploymentPipeline
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  InfrastructureDeploymentRoleArn:
    Value: !GetAtt InfrastructureDeploymentRole.Arn