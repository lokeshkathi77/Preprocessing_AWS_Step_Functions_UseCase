AWSTemplateFormatVersion: "2010-09-09"
Description: Step Functions workflow for EC2 validation and ECS transaction processing

Parameters:
  EnvironmentName:
    Type: String
    Default: demo

  ContainerName:
    Type: String
    Default: transaction-processor

  LogRetentionInDays:
    Type: Number
    Default: 14

Resources:
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${EnvironmentName}-transaction-workflow"
      RetentionInDays: !Ref LogRetentionInDays

  TransactionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-transaction-workflow"
      StateMachineType: STANDARD
      RoleArn: !ImportValue
        Fn::Sub: "${EnvironmentName}-StepFunctionsRoleArn"

      DefinitionString: !Sub
        - |
          {
            "Comment": "Validate the EC2 preprocessing instance and run the ECS transaction task",
            "StartAt": "DescribeEC2",
            "States": {
              "DescribeEC2": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ec2:describeInstances",
                "Parameters": {
                  "InstanceIds": [
                    "${Ec2InstanceId}"
                  ]
                },
                "ResultPath": "$.ec2Result",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Ec2.RequestLimitExceeded",
                      "Ec2.ServiceUnavailable",
                      "States.TaskFailed"
                    ],
                    "IntervalSeconds": 5,
                    "MaxAttempts": 3,
                    "BackoffRate": 2
                  }
                ],
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "ResultPath": "$.workflowError",
                    "Next": "WorkflowFailed"
                  }
                ],
                "Next": "EvaluateEC2State"
              },

              "EvaluateEC2State": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.ec2Result.Reservations[0].Instances[0].State.Name",
                    "StringEquals": "running",
                    "Next": "ValidateEC2"
                  },
                  {
                    "Variable": "$.ec2Result.Reservations[0].Instances[0].State.Name",
                    "StringEquals": "stopped",
                    "Next": "StartEC2"
                  },
                  {
                    "Variable": "$.ec2Result.Reservations[0].Instances[0].State.Name",
                    "StringEquals": "pending",
                    "Next": "WaitForEC2"
                  },
                  {
                    "Variable": "$.ec2Result.Reservations[0].Instances[0].State.Name",
                    "StringEquals": "stopping",
                    "Next": "WaitForEC2"
                  }
                ],
                "Default": "UnsupportedEC2State"
              },

              "StartEC2": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ec2:startInstances",
                "Parameters": {
                  "InstanceIds": [
                    "${Ec2InstanceId}"
                  ]
                },
                "ResultPath": "$.startResult",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Ec2.RequestLimitExceeded",
                      "Ec2.ServiceUnavailable",
                      "States.TaskFailed"
                    ],
                    "IntervalSeconds": 5,
                    "MaxAttempts": 3,
                    "BackoffRate": 2
                  }
                ],
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "ResultPath": "$.workflowError",
                    "Next": "WorkflowFailed"
                  }
                ],
                "Next": "WaitForEC2"
              },

              "WaitForEC2": {
                "Type": "Wait",
                "Seconds": 20,
                "Next": "DescribeEC2"
              },

              "ValidateEC2": {
                "Type": "Choice",
                "Choices": [
                  {
                    "And": [
                      {
                        "Variable": "$.ec2Result.Reservations[0].Instances[0].InstanceId",
                        "StringEquals": "${Ec2InstanceId}"
                      },
                      {
                        "Variable": "$.ec2Result.Reservations[0].Instances[0].State.Name",
                        "StringEquals": "running"
                      }
                    ],
                    "Next": "RunPreprocessing"
                  }
                ],
                "Default": "EC2ValidationFailed"
              },

              "RunPreprocessing": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ssm:sendCommand",
                "Parameters": {
                  "DocumentName": "AWS-RunShellScript",
                  "InstanceIds": [
                    "${Ec2InstanceId}"
                  ],
                  "Parameters": {
                    "commands.$": "States.Array(States.Format('set -eu; mkdir -p /opt/transaction-preprocessor/run; aws s3 cp s3://{}/{} /opt/transaction-preprocessor/run/input.csv; python3 /opt/transaction-preprocessor/preprocess.py --input /opt/transaction-preprocessor/run/input.csv --output /opt/transaction-preprocessor/run/cleaned.csv --rejected /opt/transaction-preprocessor/run/rejected.csv; aws s3 cp /opt/transaction-preprocessor/run/cleaned.csv s3://{}/processed/{}/{}/transactions_cleaned.csv; aws s3 cp /opt/transaction-preprocessor/run/rejected.csv s3://{}/errors/{}/{}/rejected_transactions.csv', $.bucket, $.key, '${OutputBucketName}', $.transactionDate, $.executionId, '${OutputBucketName}', $.transactionDate, $.executionId))"
                  }
                },
                "ResultPath": "$.preprocessingCommand",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Ssm.AmazonSSMException",
                      "Ssm.ThrottlingException",
                      "States.TaskFailed"
                    ],
                    "IntervalSeconds": 5,
                    "MaxAttempts": 3,
                    "BackoffRate": 2
                  }
                ],
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "ResultPath": "$.workflowError",
                    "Next": "WorkflowFailed"
                  }
                ],
                "Next": "WaitForPreprocessing"
              },

              "WaitForPreprocessing": {
                "Type": "Wait",
                "Seconds": 10,
                "Next": "GetPreprocessingStatus"
              },

              "GetPreprocessingStatus": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ssm:getCommandInvocation",
                "Parameters": {
                  "CommandId.$": "$.preprocessingCommand.Command.CommandId",
                  "InstanceId": "${Ec2InstanceId}"
                },
                "ResultPath": "$.preprocessingStatus",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Ssm.InvocationDoesNotExist",
                      "Ssm.AmazonSSMException",
                      "States.TaskFailed"
                    ],
                    "IntervalSeconds": 5,
                    "MaxAttempts": 5,
                    "BackoffRate": 2
                  }
                ],
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "ResultPath": "$.workflowError",
                    "Next": "WorkflowFailed"
                  }
                ],
                "Next": "EvaluatePreprocessingStatus"
              },

              "EvaluatePreprocessingStatus": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.preprocessingStatus.Status",
                    "StringEquals": "Success",
                    "Next": "SetPreprocessingPaths"
                  },
                  {
                    "Variable": "$.preprocessingStatus.Status",
                    "StringEquals": "Pending",
                    "Next": "WaitForPreprocessing"
                  },
                  {
                    "Variable": "$.preprocessingStatus.Status",
                    "StringEquals": "InProgress",
                    "Next": "WaitForPreprocessing"
                  },
                  {
                    "Variable": "$.preprocessingStatus.Status",
                    "StringEquals": "Delayed",
                    "Next": "WaitForPreprocessing"
                  }
                ],
                "Default": "PreprocessingFailed"
              },

              "SetPreprocessingPaths": {
                "Type": "Pass",
                "Parameters": {
                  "bucket": "${OutputBucketName}",
                  "key.$": "States.Format('processed/{}/{}/transactions_cleaned.csv', $.transactionDate, $.executionId)"
                },
                "ResultPath": "$.preprocessedInput",
                "Next": "RunECSTask"
              },

              "RunECSTask": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::ecs:runTask.sync",
                "Parameters": {
                  "Cluster": "${EcsClusterArn}",
                  "TaskDefinition": "${EcsTaskDefinitionArn}",
                  "LaunchType": "FARGATE",
                  "PlatformVersion": "LATEST",
                  "NetworkConfiguration": {
                    "AwsvpcConfiguration": {
                      "Subnets": [
                        "${PublicSubnetAId}",
                        "${PublicSubnetBId}"
                      ],
                      "SecurityGroups": [
                        "${EcsSecurityGroupId}"
                      ],
                      "AssignPublicIp": "ENABLED"
                    }
                  },
                  "Overrides": {
                    "ContainerOverrides": [
                      {
                        "Name": "${ContainerName}",
                        "Environment": [
                          {
                            "Name": "INPUT_BUCKET",
                            "Value.$": "$.preprocessedInput.bucket"
                          },
                          {
                            "Name": "INPUT_KEY",
                            "Value.$": "$.preprocessedInput.key"
                          },
                          {
                            "Name": "OUTPUT_BUCKET",
                            "Value": "${OutputBucketName}"
                          },
                          {
                            "Name": "TRANSACTION_DATE",
                            "Value.$": "$.transactionDate"
                          },
                          {
                            "Name": "EXECUTION_ID",
                            "Value.$": "$.executionId"
                          },
                          {
                            "Name": "RUN_MODE",
                            "Value": "s3"
                          }
                        ]
                      }
                    ]
                  }
                },
                "ResultPath": "$.ecsResult",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "ECS.AmazonECSException",
                      "ECS.ThrottlingException",
                      "AmazonECS.Unknown"
                    ],
                    "IntervalSeconds": 10,
                    "MaxAttempts": 2,
                    "BackoffRate": 2
                  }
                ],
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "ResultPath": "$.workflowError",
                    "Next": "WorkflowFailed"
                  }
                ],
                "Next": "WorkflowSucceeded"
              },

              "UnsupportedEC2State": {
                "Type": "Fail",
                "Error": "UnsupportedEC2State",
                "Cause": "The EC2 preprocessing instance is in an unsupported state."
              },

              "EC2ValidationFailed": {
                "Type": "Fail",
                "Error": "EC2ValidationFailed",
                "Cause": "The EC2 preprocessing instance could not be validated."
              },

              "PreprocessingFailed": {
                "Type": "Fail",
                "Error": "PreprocessingFailed",
                "Cause": "The EC2 preprocessing script failed."
              },

              "WorkflowFailed": {
                "Type": "Fail",
                "Error": "TransactionWorkflowFailed",
                "Cause": "EC2 validation or ECS transaction processing failed."
              },

              "WorkflowSucceeded": {
                "Type": "Succeed"
              }
            }
          }
        - Ec2InstanceId: !ImportValue
            Fn::Sub: "${EnvironmentName}-Ec2InstanceId"
          EcsClusterArn: !ImportValue
            Fn::Sub: "${EnvironmentName}-EcsClusterArn"
          EcsTaskDefinitionArn: !ImportValue
            Fn::Sub: "${EnvironmentName}-TaskDefinitionArn"
          PublicSubnetAId: !ImportValue
            Fn::Sub: "${EnvironmentName}-PublicSubnetAId"
          PublicSubnetBId: !ImportValue
            Fn::Sub: "${EnvironmentName}-PublicSubnetBId"
          EcsSecurityGroupId: !ImportValue
            Fn::Sub: "${EnvironmentName}-EcsSecurityGroupId"
          OutputBucketName: !ImportValue
            Fn::Sub: "${EnvironmentName}-OutputBucketName"

      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL

      TracingConfiguration:
        Enabled: true

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: TransactionWorkflow

Outputs:
  StateMachineArn:
    Description: Step Functions state-machine ARN
    Value: !Ref TransactionStateMachine

  StateMachineName:
    Description: Step Functions state-machine name
    Value: !GetAtt TransactionStateMachine.Name

  StateMachineLogGroupName:
    Description: Step Functions CloudWatch log group
    Value: !Ref StateMachineLogGroup
