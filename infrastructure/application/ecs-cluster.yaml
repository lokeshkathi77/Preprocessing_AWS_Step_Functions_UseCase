AWSTemplateFormatVersion: "2010-09-09"
Description: ECS cluster for transaction processing

Parameters:
  EnvironmentName:
    Type: String
    Default: demo

Resources:
  TransactionCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-transaction-cluster"

      ClusterSettings:
        - Name: containerInsights
          Value: enabled

      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: TransactionWorkflow

Outputs:
  EcsClusterName:
    Description: ECS cluster name
    Value: !Ref TransactionCluster

  EcsClusterArn:
    Description: ECS cluster ARN
    Value: !GetAtt TransactionCluster.Arn
