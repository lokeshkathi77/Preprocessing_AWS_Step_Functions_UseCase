AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate task definition for transaction processing

Parameters:
  EnvironmentName:
    Type: String
    Default: demo

  ContainerImageUri:
    Type: String

  EcsTaskExecutionRoleArn:
    Type: String
    Default: ""

  EcsTaskRoleArn:
    Type: String
    Default: ""

  OutputBucketName:
    Type: String
    Default: ""

  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues:
      - "256"
      - "512"
      - "1024"

  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues:
      - "512"
      - "1024"
      - "2048"

  LogRetentionInDays:
    Type: Number
    Default: 14

Resources:
  TransactionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/transaction-processor"
      RetentionInDays: !Ref LogRetentionInDays

  TransactionTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-transaction-processor"
      RequiresCompatibilities:
        - FARGATE

      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !If
        - HasExecutionRoleArn
        - !Ref EcsTaskExecutionRoleArn
        - !ImportValue
            Fn::Sub: "${EnvironmentName}-EcsTaskExecutionRoleArn"
      TaskRoleArn: !If
        - HasTaskRoleArn
        - !Ref EcsTaskRoleArn
        - !ImportValue
            Fn::Sub: "${EnvironmentName}-EcsTaskRoleArn"

      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX

      ContainerDefinitions:
        - Name: transaction-processor
          Image: !Ref ContainerImageUri
          Essential: true
          Cpu: 0

          Environment:
            - Name: RUN_MODE
              Value: s3
            - Name: OUTPUT_BUCKET
              Value: !If
                - HasOutputBucketName
                - !Ref OutputBucketName
                - !ImportValue
                    Fn::Sub: "${EnvironmentName}-OutputBucketName"
            - Name: LOG_LEVEL
              Value: INFO

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref TransactionLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: transaction

          ReadonlyRootFilesystem: true

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: TransactionWorkflow

Outputs:
  TaskDefinitionArn:
    Description: ECS task-definition ARN
    Value: !Ref TransactionTaskDefinition
    Export:
      Name: !Sub "${EnvironmentName}-TaskDefinitionArn"

  TaskDefinitionFamily:
    Description: ECS task-definition family
    Value: !Sub "${EnvironmentName}-transaction-processor"

  ContainerName:
    Description: ECS container name
    Value: transaction-processor

  TransactionLogGroupName:
    Description: CloudWatch log-group name
    Value: !Ref TransactionLogGroup

Conditions:
  HasExecutionRoleArn: !Not [!Equals [!Ref EcsTaskExecutionRoleArn, ""]]
  HasTaskRoleArn: !Not [!Equals [!Ref EcsTaskRoleArn, ""]]
  HasOutputBucketName: !Not [!Equals [!Ref OutputBucketName, ""]]
