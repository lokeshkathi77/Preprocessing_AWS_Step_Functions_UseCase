AWSTemplateFormatVersion: "2010-09-09"
Description: Runtime IAM roles for EC2, ECS, and Step Functions

Parameters:
  EnvironmentName:
    Type: String
    Default: demo

  EcsTaskDefinitionArn:
    Type: String
    Default: "*"

Resources:
  Ec2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-transaction-ec2-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"

      Policies:
        - PolicyName: Ec2TransactionBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListInputBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !ImportValue
                      Fn::Sub: "${EnvironmentName}-InputBucketArn"

              - Sid: ReadInputObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub
                      - "${BucketArn}/*"
                      - BucketArn: !ImportValue
                          Fn::Sub: "${EnvironmentName}-InputBucketArn"

              - Sid: WritePreprocessingOutputs
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub
                      - "${BucketArn}/*"
                      - BucketArn: !ImportValue
                          Fn::Sub: "${EnvironmentName}-OutputBucketArn"


      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: TransactionWorkflow

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-transaction-ec2-profile"
      Roles:
        - !Ref Ec2InstanceRole

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-transaction-ecs-execution-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: TransactionWorkflow

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-transaction-ecs-task-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: TransactionBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListTransactionBuckets
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !ImportValue
                      Fn::Sub: "${EnvironmentName}-InputBucketArn"
                  - !ImportValue
                      Fn::Sub: "${EnvironmentName}-OutputBucketArn"

              - Sid: ReadTransactionInput
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub
                      - "${BucketArn}/*"
                      - BucketArn: !ImportValue
                          Fn::Sub: "${EnvironmentName}-InputBucketArn"

              - Sid: WriteTransactionOutput
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub
                      - "${BucketArn}/*"
                      - BucketArn: !ImportValue
                          Fn::Sub: "${EnvironmentName}-OutputBucketArn"

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: TransactionWorkflow

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-transaction-step-functions-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - states.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: Ec2WorkflowAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeEc2
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                Resource: "*"

              - Sid: StartEc2
                Effect: Allow
                Action:
                  - ec2:StartInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"

              - Sid: RunEc2Preprocessing
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                Resource: "*"

        - PolicyName: EcsWorkflowAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunEcsTask
                Effect: Allow
                Action:
                  - ecs:RunTask
                Resource:
                  - !Ref EcsTaskDefinitionArn

              - Sid: MonitorEcsTask
                Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:StopTask
                Resource: "*"

        - PolicyName: PassEcsRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PassRolesToEcs
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt EcsTaskExecutionRole.Arn
                  - !GetAtt EcsTaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

        - PolicyName: EventBridgeEcsIntegration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageStepFunctionsEcsRule
                Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource:
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule"

        - PolicyName: StepFunctionsLogging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

        - PolicyName: XRayAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteXRayData
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: TransactionWorkflow

Outputs:
  Ec2InstanceRoleArn:
    Value: !GetAtt Ec2InstanceRole.Arn

  Ec2InstanceProfileName:
    Value: !Ref Ec2InstanceProfile
    Export:
      Name: !Sub "${EnvironmentName}-Ec2InstanceProfileName"

  EcsTaskExecutionRoleArn:
    Value: !GetAtt EcsTaskExecutionRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-EcsTaskExecutionRoleArn"

  EcsTaskRoleArn:
    Value: !GetAtt EcsTaskRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-EcsTaskRoleArn"

  StepFunctionsRoleArn:
    Value: !GetAtt StepFunctionsExecutionRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-StepFunctionsRoleArn"
