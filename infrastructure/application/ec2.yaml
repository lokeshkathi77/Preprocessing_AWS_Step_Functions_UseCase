AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 preprocessing instance for the transaction workflow

Parameters:
  EnvironmentName:
    Type: String
    Default: demo

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  SubnetId:
    Type: String
    Default: ""

  SecurityGroupId:
    Type: String
    Default: ""

  InstanceProfileName:
    Type: String
    Default: ""

  EbsVolumeSize:
    Type: Number
    Default: 10

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  HasSubnetId: !Not [!Equals [!Ref SubnetId, ""]]
  HasSecurityGroupId: !Not [!Equals [!Ref SecurityGroupId, ""]]
  HasInstanceProfileName: !Not [!Equals [!Ref InstanceProfileName, ""]]

Resources:
  PreprocessingInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !If
        - HasSubnetId
        - !Ref SubnetId
        - !ImportValue
            Fn::Sub: "${EnvironmentName}-PublicSubnetAId"

      SecurityGroupIds:
        - !If
            - HasSecurityGroupId
            - !Ref SecurityGroupId
            - !ImportValue
                Fn::Sub: "${EnvironmentName}-Ec2SecurityGroupId"

      IamInstanceProfile: !If
        - HasInstanceProfileName
        - !Ref InstanceProfileName
        - !ImportValue
            Fn::Sub: "${EnvironmentName}-Ec2InstanceProfileName"
      Monitoring: false

      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1

      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref EbsVolumeSize
            Encrypted: true
            DeleteOnTermination: true

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          trap 'echo FAILED > /opt/transaction-preprocessor/status' ERR

          mkdir -p /opt/transaction-preprocessor
          dnf install -y python3
          echo BOOTSTRAPPING > /opt/transaction-preprocessor/status

          cat > /opt/transaction-preprocessor/preprocess.py <<'PYTHON'
          import argparse
          import csv
          import sys
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          REQUIRED_COLUMNS = ("transaction_id", "amount", "currency")

          def clean(row):
              transaction_id = (row.get("transaction_id") or "").strip()
              amount_text = (row.get("amount") or "").strip()
              currency = (row.get("currency") or "").strip().upper()
              if not transaction_id:
                  raise ValueError("transaction_id is missing")
              if not currency:
                  raise ValueError("currency is missing")
              try:
                  amount = Decimal(amount_text)
              except InvalidOperation as exc:
                  raise ValueError("amount is not numeric") from exc
              if amount <= 0:
                  raise ValueError("amount must be greater than zero")
              return {"transaction_id": transaction_id, "amount": format(amount, "f"), "currency": currency}

          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--input", required=True)
              parser.add_argument("--output", required=True)
              parser.add_argument("--rejected", required=True)
              args = parser.parse_args()
              seen = set()
              valid = rejected = 0
              Path(args.output).parent.mkdir(parents=True, exist_ok=True)
              Path(args.rejected).parent.mkdir(parents=True, exist_ok=True)
              with open(args.input, encoding="utf-8-sig", newline="") as source, open(args.output, "w", newline="") as output, open(args.rejected, "w", newline="") as errors:
                  reader = csv.DictReader(source)
                  if reader.fieldnames is None or not set(REQUIRED_COLUMNS).issubset(reader.fieldnames):
                      raise ValueError("CSV must contain transaction_id, amount, and currency columns")
                  writer = csv.DictWriter(output, fieldnames=REQUIRED_COLUMNS)
                  error_writer = csv.DictWriter(errors, fieldnames=(*REQUIRED_COLUMNS, "error"))
                  writer.writeheader()
                  error_writer.writeheader()
                  for row in reader:
                      try:
                          cleaned = clean(row)
                          if cleaned["transaction_id"] in seen:
                              raise ValueError("duplicate transaction_id")
                          seen.add(cleaned["transaction_id"])
                          writer.writerow(cleaned)
                          valid += 1
                      except (TypeError, ValueError) as exc:
                          error_writer.writerow({column: row.get(column, "") for column in REQUIRED_COLUMNS} | {"error": str(exc)})
                          rejected += 1
              print(f"Preprocessing complete: valid={valid}, rejected={rejected}")

          if __name__ == "__main__":
              try:
                  main()
              except (OSError, ValueError) as exc:
                  print(f"Preprocessing failed: {exc}", file=sys.stderr)
                  raise SystemExit(1)
          PYTHON
          chmod 755 /opt/transaction-preprocessor/preprocess.py
          echo READY > /opt/transaction-preprocessor/status

          cat > /opt/transaction-preprocessor/metadata.json <<EOF
          {
            "environment": "${EnvironmentName}",
            "purpose": "TransactionPreprocessor",
            "status": "READY",
            "script": "/opt/transaction-preprocessor/preprocess.py"
          }
          EOF

          chmod 644 /opt/transaction-preprocessor/status
          chmod 644 /opt/transaction-preprocessor/metadata.json

      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-transaction-preprocessor"
        - Key: Purpose
          Value: TransactionPreprocessor
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: TransactionWorkflow

Outputs:
  Ec2InstanceId:
    Description: EC2 preprocessing instance ID
    Value: !Ref PreprocessingInstance
    Export:
      Name: !Sub "${EnvironmentName}-Ec2InstanceId"

  Ec2PrivateIp:
    Description: EC2 private IP address
    Value: !GetAtt PreprocessingInstance.PrivateIp

  Ec2AvailabilityZone:
    Description: EC2 Availability Zone
    Value: !GetAtt PreprocessingInstance.AvailabilityZone
