AWSTemplateFormatVersion: "2010-09-09"
Description: Parent stack for the transaction-processing demonstration

Parameters:
  EnvironmentName:
    Type: String
    Default: demo

  ContainerImageUri:
    Type: String

  Ec2InstanceType:
    Type: String
    Default: t3.micro

  EbsVolumeSize:
    Type: Number
    Default: 10

  LogRetentionInDays:
    Type: Number
    Default: 14

  PreprocessingScriptBucketName:
    Type: String

  PreprocessingScriptKey:
    Type: String

  TaskCpu:
    Type: String
    Default: "256"

  TaskMemory:
    Type: String
    Default: "512"

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16

  PublicSubnetACidr:
    Type: String
    Default: 10.20.1.0/24

  PublicSubnetBCidr:
    Type: String
    Default: 10.20.2.0/24

Resources:
  NetworkingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: networking.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr
        PublicSubnetACidr: !Ref PublicSubnetACidr
        PublicSubnetBCidr: !Ref PublicSubnetBCidr

  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkingStack
    Properties:
      TemplateURL: security-groups.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkingStack.Outputs.VpcId
        VpcCidr: !GetAtt NetworkingStack.Outputs.VpcCidr

  StorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: s3.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  IamStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - StorageStack
    Properties:
      TemplateURL: iam.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        InputBucketArn: !GetAtt StorageStack.Outputs.InputBucketArn
        OutputBucketArn: !GetAtt StorageStack.Outputs.OutputBucketArn
        PreprocessingScriptBucketArn: !Sub
          - "arn:${AWS::Partition}:s3:::${BucketName}"
          - BucketName: !Ref PreprocessingScriptBucketName
        PreprocessingScriptObjectArn: !Sub
          - "arn:${AWS::Partition}:s3:::${BucketName}/${ScriptKey}"
          - BucketName: !Ref PreprocessingScriptBucketName
            ScriptKey: !Ref PreprocessingScriptKey
        EcsTaskDefinitionArn: "*"

  Ec2Stack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkingStack
      - SecurityGroupsStack
      - IamStack
    Properties:
      TemplateURL: ec2.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        InstanceType: !Ref Ec2InstanceType
        EbsVolumeSize: !Ref EbsVolumeSize
        PreprocessingScriptBucketName: !Ref PreprocessingScriptBucketName
        PreprocessingScriptKey: !Ref PreprocessingScriptKey
        SubnetId: !GetAtt NetworkingStack.Outputs.PublicSubnetAId
        SecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.Ec2SecurityGroupId
        InstanceProfileName: !GetAtt IamStack.Outputs.Ec2InstanceProfileName

  EcsClusterStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ecs-cluster.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  EcsTaskDefinitionStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - IamStack
      - StorageStack
    Properties:
      TemplateURL: ecs-task-definition.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ContainerImageUri: !Ref ContainerImageUri
        EcsTaskExecutionRoleArn: !GetAtt IamStack.Outputs.EcsTaskExecutionRoleArn
        EcsTaskRoleArn: !GetAtt IamStack.Outputs.EcsTaskRoleArn
        OutputBucketName: !GetAtt StorageStack.Outputs.OutputBucketName
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        LogRetentionInDays: !Ref LogRetentionInDays

  StepFunctionsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - Ec2Stack
      - EcsClusterStack
      - EcsTaskDefinitionStack
      - SecurityGroupsStack
    Properties:
      TemplateURL: step-functions.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        Ec2InstanceId: !GetAtt Ec2Stack.Outputs.Ec2InstanceId
        EcsClusterArn: !GetAtt EcsClusterStack.Outputs.EcsClusterArn
        EcsTaskDefinitionArn: !GetAtt EcsTaskDefinitionStack.Outputs.TaskDefinitionArn
        StepFunctionsRoleArn: !GetAtt IamStack.Outputs.StepFunctionsRoleArn
        PublicSubnetAId: !GetAtt NetworkingStack.Outputs.PublicSubnetAId
        PublicSubnetBId: !GetAtt NetworkingStack.Outputs.PublicSubnetBId
        EcsSecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.EcsSecurityGroupId
        OutputBucketName: !GetAtt StorageStack.Outputs.OutputBucketName
        ContainerName: !GetAtt EcsTaskDefinitionStack.Outputs.ContainerName
        LogRetentionInDays: !Ref LogRetentionInDays
        PreprocessingScriptBucketName: !Ref PreprocessingScriptBucketName
        PreprocessingScriptKey: !Ref PreprocessingScriptKey

Outputs:
  VpcId:
    Description: Transaction VPC ID
    Value: !GetAtt NetworkingStack.Outputs.VpcId

  PublicSubnetAId:
    Description: Public subnet A ID
    Value: !GetAtt NetworkingStack.Outputs.PublicSubnetAId

  PublicSubnetBId:
    Description: Public subnet B ID
    Value: !GetAtt NetworkingStack.Outputs.PublicSubnetBId

  Ec2InstanceId:
    Description: EC2 preprocessing instance ID
    Value: !GetAtt Ec2Stack.Outputs.Ec2InstanceId

  EcsClusterArn:
    Description: ECS cluster ARN
    Value: !GetAtt EcsClusterStack.Outputs.EcsClusterArn

  EcsTaskDefinitionArn:
    Description: ECS task-definition ARN
    Value: !GetAtt EcsTaskDefinitionStack.Outputs.TaskDefinitionArn

  StateMachineArn:
    Description: Step Functions state-machine ARN
    Value: !GetAtt StepFunctionsStack.Outputs.StateMachineArn

  StateMachineName:
    Description: Step Functions state-machine name
    Value: !GetAtt StepFunctionsStack.Outputs.StateMachineName

  InputBucketName:
    Description: Transaction input bucket name
    Value: !GetAtt StorageStack.Outputs.InputBucketName

  OutputBucketName:
    Description: Transaction output bucket name
    Value: !GetAtt StorageStack.Outputs.OutputBucketName

  EcsLogGroupName:
    Description: ECS task CloudWatch log group
    Value: !GetAtt EcsTaskDefinitionStack.Outputs.TransactionLogGroupName
