AWSTemplateFormatVersion: '2010-09-09'
Description: Step Functions workflow for EC2 validation and ECS processing.

Parameters:
  EnvironmentName:
    Type: String

Resources:
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineType: STANDARD
      RoleArn:
        Fn::ImportValue: !Sub '${EnvironmentName}-StepFunctionsRoleArn'
      DefinitionString: !Sub
        - |
          {
            "Comment": "Validate EC2, then process a transaction with ECS",
            "StartAt": "CheckEC2",
            "States": {
              "CheckEC2": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ec2:describeInstances",
                "Parameters": {
                  "InstanceIds": ["${EC2InstanceId}"]
                },
                "ResultPath": "$.ec2Description",
                "Next": "EC2Running?"
              },
              "EC2Running?": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.ec2Description.Reservations[0].Instances[0].State.Name",
                    "StringEquals": "running",
                    "Next": "PreprocessTransactions"
                  }
                ],
                "Default": "StartEC2"
              },
              "StartEC2": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ec2:startInstances",
                "Parameters": {
                  "InstanceIds": ["${EC2InstanceId}"]
                },
                "Next": "WaitForEC2"
              },
              "WaitForEC2": {
                "Type": "Wait",
                "Seconds": 20,
                "Next": "CheckEC2"
              },
              "PreprocessTransactions": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ssm:sendCommand",
                "Parameters": {
                  "DocumentName": "AWS-RunShellScript",
                  "InstanceIds": ["${EC2InstanceId}"],
                  "Parameters": {
                    "commands.$": "States.Array(\"set -eu\", States.Format(\"export INPUT_FILE='{}'\", $.transactionFile), States.Format(\"export OUTPUT_FILE='{}'\", $.processedFile), \"aws s3 cp \\\"$${INPUT_FILE}\\\" /tmp/transactions.csv\", \"amount_index=$(awk -F, -v column=amount 'NR==1 { for (i=1; i<=NF; i++) if ($i==column) { print i; exit } }' /tmp/transactions.csv)\", \"test -n \\\"$${amount_index}\\\"\", \"awk -F, -v amount_index=\\\"$${amount_index}\\\" 'BEGIN { OFS=FS } NR==1 { print; next } { for (i=1; i<=NF; i++) if ($i==\\\"\\\") { if (i==amount_index) $i=\\\"0\\\"; else $i=\\\"UNKNOWN\\\" } print }' /tmp/transactions.csv > /tmp/normalized-transactions.csv\", \"output_bucket=\\\"$${OUTPUT_FILE#s3://}\\\"\", \"output_bucket=\\\"$${output_bucket%%/*}\\\"\", \"output_key=\\\"$${OUTPUT_FILE#s3://$${output_bucket}/}\\\"\", \"aws s3 cp /tmp/normalized-transactions.csv \\\"s3://$${output_bucket}/$${output_key}\\\"\")"
                  }
                },
                "ResultPath": "$.preprocessCommand",
                "Next": "WaitForPreprocess"
              },
              "WaitForPreprocess": {
                "Type": "Wait",
                "Seconds": 10,
                "Next": "GetPreprocessStatus"
              },
              "GetPreprocessStatus": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ssm:getCommandInvocation",
                "Parameters": {
                  "CommandId.$": "$.preprocessCommand.Command.CommandId",
                  "InstanceId": "${EC2InstanceId}"
                },
                "ResultPath": "$.preprocessStatus",
                "Next": "PreprocessComplete?"
              },
              "PreprocessComplete?": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.preprocessStatus.Status",
                    "StringEquals": "Success",
                    "Next": "RunECSTask"
                  },
                  {
                    "Variable": "$.preprocessStatus.Status",
                    "StringEquals": "Failed",
                    "Next": "PreprocessFailed"
                  }
                ],
                "Default": "WaitForPreprocess"
              },
              "PreprocessFailed": {
                "Type": "Fail",
                "Cause": "EC2 transaction preprocessing failed"
              },
              "RunECSTask": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::ecs:runTask.sync",
                "Parameters": {
                  "Cluster": "${ECSClusterArn}",
                  "TaskDefinition": "${TaskDefinitionArn}",
                  "LaunchType": "FARGATE",
                  "NetworkConfiguration": {
                    "AwsvpcConfiguration": {
                      "Subnets": ["${PrivateSubnetAId}", "${PrivateSubnetBId}"],
                      "SecurityGroups": ["${ECSSecurityGroupId}"],
                      "AssignPublicIp": "DISABLED"
                    }
                  },
                  "Overrides": {
                    "ContainerOverrides": [
                      {
                        "Name": "transaction-worker",
                        "Environment": [
                          {
                            "Name": "TRANSACTION_FILE",
                            "Value.$": "$.processedFile"
                          }
                        ]
                      }
                    ]
                  }
                },
                "Retry": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "IntervalSeconds": 10,
                    "MaxAttempts": 2,
                    "BackoffRate": 2
                  }
                ],
                "End": true
              }
            }
          }
        - EC2InstanceId:
            Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceId'
          ECSClusterArn:
            Fn::ImportValue: !Sub '${EnvironmentName}-ECSClusterArn'
          TaskDefinitionArn:
            Fn::ImportValue: !Sub '${EnvironmentName}-TaskDefinitionArn'
          PrivateSubnetAId:
            Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnetAId'
          PrivateSubnetBId:
            Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnetBId'
          ECSSecurityGroupId:
            Fn::ImportValue: !Sub '${EnvironmentName}-ECSSecurityGroupId'

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine
