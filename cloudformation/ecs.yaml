AWSTemplateFormatVersion: '2010-09-09'
Description: ECS cluster and transaction task definition using an existing image.

Parameters:
  EnvironmentName:
    Type: String
  ContainerImage:
    Type: String

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-transaction-worker'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskRoleArn'
      ContainerDefinitions:
        - Name: transaction-worker
          Image: !Ref ContainerImage
          Essential: true
          EntryPoint:
            - /bin/sh
            - -c
          Command:
            - >-
              set -eu;
              aws s3 cp "$TRANSACTION_FILE" /tmp/transactions.csv;
              amount_column="${TRANSACTION_AMOUNT_COLUMN:-amount}";
              amount_index=$(awk -F, -v column="$amount_column"
              'NR == 1 { for (i = 1; i <= NF; i++) if ($i == column) { print i; exit } }'
              /tmp/transactions.csv);
              test -n "$amount_index";
              awk -F, -v index="$amount_index"
              'NR > 1 { count++; total += $index }
              END { printf "record_count=%d total_amount=%.2f\n", count, total }'
              /tmp/transactions.csv
          Environment:
            - Name: TRANSACTION_AMOUNT_COLUMN
              Value: amount
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: transaction

Outputs:
  ClusterArn:
    Value: !GetAtt Cluster.Arn
    Export:
      Name: !Sub '${EnvironmentName}-ECSClusterArn'
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${EnvironmentName}-TaskDefinitionArn'
