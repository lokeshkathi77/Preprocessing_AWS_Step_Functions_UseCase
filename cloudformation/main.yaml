AWSTemplateFormatVersion: '2010-09-09'
Description: Root nested stack for the transaction processing platform.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment identifier supplied by the deployment.
  VpcCidr:
    Type: String
    Description: VPC CIDR supplied by the deployment.
  PrivateSubnetACidr:
    Type: String
    Description: CIDR for private subnet A supplied by the deployment.
  PrivateSubnetBCidr:
    Type: String
    Description: CIDR for private subnet B supplied by the deployment.

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr
        PrivateSubnetACidr: !Ref PrivateSubnetACidr
        PrivateSubnetBCidr: !Ref PrivateSubnetBCidr
      TemplateURL: network.yaml

Outputs:
  VpcId:
    Description: VPC created by the network nested stack.
    Value: !GetAtt NetworkStack.Outputs.VpcId
  PrivateSubnetAId:
    Description: Private subnet A created by the network nested stack.
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnetAId
  PrivateSubnetBId:
    Description: Private subnet B created by the network nested stack.
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnetBId
  EC2SecurityGroupId:
    Description: EC2 security group created by the network nested stack.
    Value: !GetAtt NetworkStack.Outputs.EC2SecurityGroupId
  ECSSecurityGroupId:
    Description: ECS security group created by the network nested stack.
    Value: !GetAtt NetworkStack.Outputs.ECSSecurityGroupId
