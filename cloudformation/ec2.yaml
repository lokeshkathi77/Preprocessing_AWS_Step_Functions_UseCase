AWSTemplateFormatVersion: '2010-09-09'
Description: Private EC2 preprocessing instance.

Parameters:
  EnvironmentName:
    Type: String

Resources:
  PreprocessingInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.micro
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnetAId'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-EC2SecurityGroupId'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            VolumeSize: 8
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-preprocessor'
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  InstanceId:
    Value: !Ref PreprocessingInstance
    Export:
      Name: !Sub '${EnvironmentName}-EC2InstanceId'
