AWSTemplateFormatVersion: '2010-09-09'
Description: AWS-native deployment foundation for the transaction platform.

Parameters:
  ConnectionArn:
    Type: String
    Description: ARN of the AVAILABLE AWS CodeConnections GitHub connection.
  FullRepositoryId:
    Type: String
    Description: GitHub repository in owner/name format.
  BranchName:
    Type: String
    Description: Source branch used by CodePipeline.
  ApplicationStackName:
    Type: String
    Description: CloudFormation stack deployed by the pipeline.
  EnvironmentName:
    Type: String
    Description: Environment name passed to the application stack.
  VpcCidr:
    Type: String
    Description: VPC CIDR passed to the application stack.
  PrivateSubnetACidr:
    Type: String
    Description: Private subnet A CIDR passed to the application stack.
  PrivateSubnetBCidr:
    Type: String
    Description: Private subnet B CIDR passed to the application stack.
  ArtifactBucketName:
    Type: String
    Default: ''
    Description: Optional globally unique artifact bucket name.

Conditions:
  HasArtifactBucketName: !Not
    - !Equals
      - !Ref ArtifactBucketName
      - ''
  HasGeneratedArtifactBucket: !Equals
    - !Ref ArtifactBucketName
    - ''

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Condition: HasArtifactBucketName
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  GeneratedArtifactBucket:
    Type: AWS::S3::Bucket
    Condition: HasGeneratedArtifactBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineServicePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:ListBucket
                Resource:
                  - !If
                    - HasArtifactBucketName
                    - !GetAtt ArtifactBucket.Arn
                    - !GetAtt GeneratedArtifactBucket.Arn
                  - !If
                    - HasArtifactBucketName
                    - !Sub
                      - '${BucketArn}/*'
                      - BucketArn: !GetAtt ArtifactBucket.Arn
                    - !Sub
                      - '${BucketArn}/*'
                      - BucketArn: !GetAtt GeneratedArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt PackagingProject.Arn

  InfrastructureDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
                - codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InfrastructureDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:*
                  - ecs:*
                  - ecr:*
                  - events:*
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:PassRole
                  - logs:*
                  - states:*
                  - s3:*
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: '*'

  PackagingServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PackagingServicePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource:
                  - !If
                    - HasArtifactBucketName
                    - !GetAtt ArtifactBucket.Arn
                    - !GetAtt GeneratedArtifactBucket.Arn
                  - !If
                    - HasArtifactBucketName
                    - !Sub
                      - '${BucketArn}/*'
                      - BucketArn: !GetAtt ArtifactBucket.Arn
                    - !Sub
                      - '${BucketArn}/*'
                      - BucketArn: !GetAtt GeneratedArtifactBucket.Arn

  PackagingProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt PackagingServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ARTIFACT_BUCKET
            Value: !If
              - HasArtifactBucketName
              - !Ref ArtifactBucket
              - !Ref GeneratedArtifactBucket
      TimeoutInMinutes: 10

  DeploymentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      ArtifactStore:
        Location: !If
          - HasArtifactBucketName
          - !Ref ArtifactBucket
          - !Ref GeneratedArtifactBucket
        Type: S3
      RoleArn: !GetAtt PipelineServiceRole.Arn
      RestartExecutionOnUpdate: true
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                DetectChanges: false
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
        - Name: Package
          Actions:
            - Name: PackageCloudFormation
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref PackagingProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: PackagedOutput
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployApplicationStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                ChangeSetName: !Sub '${ApplicationStackName}-change-set'
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}","VpcCidr":"${VpcCidr}","PrivateSubnetACidr":"${PrivateSubnetACidr}","PrivateSubnetBCidr":"${PrivateSubnetBCidr}"}'
                  - EnvironmentName: !Ref EnvironmentName
                    VpcCidr: !Ref VpcCidr
                    PrivateSubnetACidr: !Ref PrivateSubnetACidr
                    PrivateSubnetBCidr: !Ref PrivateSubnetBCidr
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
                StackName: !Ref ApplicationStackName
                TemplatePath: PackagedOutput::packaged.yaml
              InputArtifacts:
                - Name: PackagedOutput
              RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
              RunOrder: 1

Outputs:
  ArtifactBucketName:
    Description: S3 bucket used by CodePipeline.
    Value: !If
      - HasArtifactBucketName
      - !Ref ArtifactBucket
      - !Ref GeneratedArtifactBucket
  DeploymentPipelineName:
    Description: CodePipeline name.
    Value: !Ref DeploymentPipeline
  InfrastructureDeploymentRoleArn:
    Description: Single role used by CloudFormation to provision the platform.
    Value: !GetAtt InfrastructureDeploymentRole.Arn
  PipelineServiceRoleArn:
    Description: CodePipeline service role.
    Value: !GetAtt PipelineServiceRole.Arn
