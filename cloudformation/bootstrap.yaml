AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub-driven CodePipeline foundation without CodeBuild.

Parameters:
  ConnectionArn:
    Type: String
  FullRepositoryId:
    Type: String
  BranchName:
    Type: String
  ApplicationStackName:
    Type: String
  EnvironmentName:
    Type: String
  VpcCidr:
    Type: String
  PublicSubnetCidr:
    Type: String
  PrivateSubnetACidr:
    Type: String
  PrivateSubnetBCidr:
    Type: String
  ContainerImage:
    Type: String
    Description: Existing AWS-provided or approved ECR image URI.

Resources:
  GeneratedArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  TransactionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineServicePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:ListBucket
                Resource:
                  - !GetAtt GeneratedArtifactBucket.Arn
                  - !Sub '${GeneratedArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:ValidateTemplate
                Resource: '*'

  InfrastructureDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InfrastructureProvisioning
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:*
                  - ecs:*
                  - iam:*
                  - logs:*
                  - states:*
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource: '*'

  DeploymentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref GeneratedArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                DetectChanges: true
              OutputArtifacts:
                - Name: Source
        - Name: Network
          Actions:
            - Name: DeployNetwork
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub '${ApplicationStackName}-Network'
                TemplatePath: Source::cloudformation/network.yaml
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}","VpcCidr":"${VpcCidr}","PublicSubnetCidr":"${PublicSubnetCidr}","PrivateSubnetACidr":"${PrivateSubnetACidr}","PrivateSubnetBCidr":"${PrivateSubnetBCidr}"}'
                  - EnvironmentName: !Ref EnvironmentName
                    VpcCidr: !Ref VpcCidr
                    PublicSubnetCidr: !Ref PublicSubnetCidr
                    PrivateSubnetACidr: !Ref PrivateSubnetACidr
                    PrivateSubnetBCidr: !Ref PrivateSubnetBCidr
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
              InputArtifacts:
                - Name: Source
        - Name: IAM
          Actions:
            - Name: DeployIAM
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub '${ApplicationStackName}-IAM'
                TemplatePath: Source::cloudformation/iam.yaml
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}"}'
                  - EnvironmentName: !Ref EnvironmentName
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
              InputArtifacts:
                - Name: Source
        - Name: EC2
          Actions:
            - Name: DeployEC2
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub '${ApplicationStackName}-EC2'
                TemplatePath: Source::cloudformation/ec2.yaml
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}"}'
                  - EnvironmentName: !Ref EnvironmentName
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
              InputArtifacts:
                - Name: Source
        - Name: ECS
          Actions:
            - Name: DeployECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub '${ApplicationStackName}-ECS'
                TemplatePath: Source::cloudformation/ecs.yaml
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}","ContainerImage":"${ContainerImage}"}'
                  - EnvironmentName: !Ref EnvironmentName
                    ContainerImage: !Ref ContainerImage
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
              InputArtifacts:
                - Name: Source
        - Name: StepFunctions
          Actions:
            - Name: DeployStepFunctions
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub '${ApplicationStackName}-StepFunctions'
                TemplatePath: Source::cloudformation/stepfunctions.yaml
                ParameterOverrides: !Sub
                  - '{"EnvironmentName":"${EnvironmentName}"}'
                  - EnvironmentName: !Ref EnvironmentName
                RoleArn: !GetAtt InfrastructureDeploymentRole.Arn
              InputArtifacts:
                - Name: Source

Outputs:
  PipelineName:
    Value: !Ref DeploymentPipeline
  InfrastructureDeploymentRoleArn:
    Value: !GetAtt InfrastructureDeploymentRole.Arn
  ArtifactBucketName:
    Value: !Ref GeneratedArtifactBucket
  TransactionBucketName:
    Value: !Ref TransactionBucket
    Export:
      Name: !Sub '${EnvironmentName}-TransactionBucketName'
